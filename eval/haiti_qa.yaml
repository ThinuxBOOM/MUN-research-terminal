    expect_symbols: ["S/RES/2700 (2023)"]
  # --- votes (checked against the votes table) -----------------------------
  - id: v01
    category: votes
    question: How did China vote on resolution 2793?
    expect_symbols: ["S/RES/2793 (2025)"]
    expect_vote: [{symbol: "S/RES/2793 (2025)", iso3: CHN, vote: A}]
  - id: v02
    category: votes
    question: How did Russia vote on resolution 2793?
    expect_symbols: ["S/RES/2793 (2025)"]
    expect_vote: [{symbol: "S/RES/2793 (2025)", iso3: RUS, vote: A}]
  - id: v03
    category: votes
    question: How did Pakistan vote on the Gang Suppression Force resolution?
    expect_symbols: ["S/RES/2793 (2025)"]
    expect_vote: [{symbol: "S/RES/2793 (2025)", iso3: PAK, vote: A}]
  - id: v04
    category: votes
    question: How did the United States vote on the BINUH renewal in 2024?
    expect_symbols: ["S/RES/2743 (2024)"]
    expect_vote: [{symbol: "S/RES/2743 (2024)", iso3: USA, vote: Y}]
  - id: v05
    category: votes
    question: How did France vote on the MSS renewal in 2024?
    expect_symbols: ["S/RES/2751 (2024)"]
    expect_vote: [{symbol: "S/RES/2751 (2024)", iso3: FRA, vote: Y}]
  - id: v06
    category: votes
    question: How did China vote on resolution 2699?
    expect_symbols: ["S/RES/2699 (2023)"]
    expect_vote: [{symbol: "S/RES/2699 (2023)", iso3: CHN, vote: A}]
