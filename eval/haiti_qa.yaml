# Haiti evaluation set. Draft questions only: verified: false until the user checks them.
# Answers and expected sources were drafted from documents ingested in this library.
# Run: python eval/run_eval.py            (retrieval, refusals, vote table)
#      python eval/run_eval.py --answers 5 (also generates 5 answers and checks markers)
questions:
  # --- exact lookups -------------------------------------------------------
  - id: e01
    category: exact
    question: Which resolution established BINUH?
    expect_symbols: ["S/RES/2476 (2019)"]
  - id: e02
    category: exact
    question: Which resolution authorises the Gang Suppression Force?
    expect_symbols: ["S/RES/2793 (2025)"]
  - id: e03
    category: exact
    question: Which resolution renewed the Multinational Security Support mandate in 2024?
    expect_symbols: ["S/RES/2751 (2024)"]
  - id: e04
    category: exact
    question: Which resolution renewed BINUH until 15 July 2025?
    expect_symbols: ["S/RES/2743 (2024)"]
  - id: e05
    category: exact
    question: Which resolution renewed BINUH in 2023?
    expect_symbols: ["S/RES/2692 (2023)"]
  - id: e06
    category: exact
    question: Which resolution established the Haiti sanctions regime?
    expect_symbols: ["S/RES/2653 (2022)"]
  - id: e07
    category: exact
    question: What does Article 51 of the UN Charter allow a State to do?
    expect_symbols: ["UN CHARTER"]
  - id: e08
    category: exact
    question: What does Article 33 of the UN Charter require parties to a dispute to do?
    expect_symbols: ["UN CHARTER"]
